<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Aral Neon · ورود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/neon.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23260810' stroke='%23D4AF37' stroke-width='2'/%3E%3Ctext x='16' y='21' font-size='12' font-family='monospace' fill='%23D4AF37' text-anchor='middle'%3EAN%3C/text%3E%3C/svg%3E">
</head>
<body class="login-body">
<div class="particles" id="particles"></div>

<div class="card login-card">
  <div class="login-logo"><b>AN</b></div>
  <h1>Aral Neon</h1>
  <div class="tagline" id="tagline">یک پورت، همهٔ پروتکل‌ها، درخشش طلایی</div>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label id="lblPw" for="pw">رمز عبور</label>
      <input class="ltr" id="pw" name="password" type="password" required
             minlength="8" autocomplete="current-password" placeholder="••••••••">
      <div class="hint" id="pwHint"></div>
    </div>
    <button class="btn lg" type="submit" id="btnLogin" style="width:100%">ورود به پنل</button>
  </form>

  <div class="login-err" id="err"></div>
  <div class="login-foot">ARAL NEON · ONE PORT · EVERY PROTOCOL</div>
</div>

<script>
(function () {
  // Golden particle field (CSS-animated, GPU-cheap)
  var box = document.getElementById('particles');
  for (var i = 0; i < 26; i++) {
    var p = document.createElement('i');
    var s = 1.5 + Math.random() * 3.5;
    p.style.width = s + 'px';
    p.style.height = s + 'px';
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.animationDuration = (9 + Math.random() * 14) + 's';
    p.style.animationDelay = (Math.random() * -20) + 's';
    box.appendChild(p);
  }

  var form = document.getElementById('loginForm');
  var pw = document.getElementById('pw');
  var btn = document.getElementById('btnLogin');
  var err = document.getElementById('err');
  var lblPw = document.getElementById('lblPw');
  var tagline = document.getElementById('tagline');
  var pwHint = document.getElementById('pwHint');

  // Query the panel: setup mode (no password yet) or login mode.
  var BASE = window.__NEON_BASE || '';
  fetch(BASE + '/api/login', { method: 'GET' }).catch(function () {});
  // health tells us whether a password exists; the endpoint never leaks it.
  fetch(BASE + '/api/health', { headers: { 'x-neon-req': '1' } })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (h) {
      if (h && h.setup === false) {
        lblPw.textContent = 'رمز عبور جدید';
        pw.setAttribute('autocomplete', 'new-password');
        pwHint.textContent = 'اولین اجرا: رمز پنل را بسازید (حداقل ۸ کاراکتر)';
        document.getElementById('btnLogin').textContent = 'ساخت رمز و ورود';
        tagline.textContent = 'برای شروع، رمز عبور پنل را بسازید';
      }
    })
    .catch(function () {});

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.classList.remove('on');
    btn.disabled = true;
    var old = btn.textContent;
    btn.textContent = '...';
    fetch(BASE + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-neon-req': '1' },
      body: JSON.stringify({ password: pw.value })
    })
      .then(function (r) { return r.json().then(function (j) { return { code: r.status, j: j }; }); })
      .then(function (res) {
        if (res.j && res.j.ok) {
          location.href = BASE + '/';
          return;
        }
        btn.disabled = false;
        btn.textContent = old;
        err.textContent = (res.j && res.j.error) || 'خطای ناشناخته';
        err.classList.add('on');
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = old;
        err.textContent = 'ارتباط با سرور برقرار نشد';
        err.classList.add('on');
      });
  });
})();
</script>
</body>
</html>
